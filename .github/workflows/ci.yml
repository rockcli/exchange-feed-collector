name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with ruff
        run: uv run ruff check src tests
      - name: Type-check with mypy
        run: uv run mypy src tests
      - name: Run unit and integration tests
        run: uv run pytest -q
      - name: Verify deterministic offline demo
        run: uv run exchange-collector demo
